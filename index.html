<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Support and privacy information for the Bhagavad Gita mobile app." />
    <title>Bhagavad Gita - Support</title>
    <style>
      :root {
        color-scheme: light;
        --red: #7c1016;
        --red-dark: #4d090d;
        --gold: #c99121;
        --ink: #241b18;
        --muted: #6c5d57;
        --paper: #fffaf0;
        --line: #dfcda8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.65;
      }

      header {
        background: var(--red);
        border-bottom: 5px solid var(--gold);
        color: #fffaf0;
        padding: 64px 24px 56px;
        text-align: center;
      }

      header p { color: #f1d9a4; margin: 8px 0 0; }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      main {
        margin: 0 auto;
        max-width: 760px;
        padding: 48px 24px 64px;
      }

      h2 { color: var(--red-dark); margin-top: 0; }

      .rule {
        background: var(--gold);
        height: 3px;
        margin: 32px 0;
        width: 56px;
      }

      a { color: var(--red); font-weight: 700; }
      a:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 48px;
        padding-top: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Bhagavad Gita</h1>
      <p>Mobile app support</p>
    </header>
    <main>
      <h2>Support</h2>
      <p>
        For questions, corrections, or technical support concerning the Bhagavad Gita mobile app,
        email <!--email_off--><a href="mailto:support@ishwarjha.com">support@ishwarjha.com</a><!--/email_off-->.
      </p>
      <div class="rule" aria-hidden="true"></div>
      <h2>Privacy</h2>
      <p>
        The app does not collect or share personal user data. Read the complete
        <a href="privacy/">Bhagavad Gita Privacy Policy</a>.
      </p>
      <footer>&copy; 2026 Ishwar Jha</footer>
    </main>
  </body>
</html>
